name: CI — Resilience Profiler

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install fastapi uvicorn sqlalchemy python-jose passlib pytest httpx

      - name: Check Python version
        run: python --version

      - name: Verify install
        run: pip list
